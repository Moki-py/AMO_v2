[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amocrm-exporter"
version = "2.0.0"
description = "Система экспорта данных из AmoCRM с веб-интерфейсом"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "AmoCRM Exporter Team"}
]
maintainers = [
    {name = "AmoCRM Exporter Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.7"
dependencies = [
    "requests",
    "python-dotenv",
    "APScheduler",
    "fastapi",
    "uvicorn",
    "jinja2",
    "pydantic-settings",
    "pymongo",
    "pandas",
    "openpyxl",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "faststream[rabbit,cli]",
    "schedule",
    "redis",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/your-repo/amocrm-exporter"
Documentation = "https://github.com/your-repo/amocrm-exporter#readme"
Repository = "https://github.com/your-repo/amocrm-exporter.git"
"Bug Tracker" = "https://github.com/your-repo/amocrm-exporter/issues"

[project.scripts]
amocrm-exporter = "amocrm_exporter.cli:main"
amocrm-web = "amocrm_exporter.cli:web_main"
amocrm-worker = "amocrm_exporter.cli:worker_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amocrm_exporter.web" = ["templates/*.html"]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]