<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки экспорта и управление пресетами - AmoCRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray: #6b7280;
            --light-gray: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --animation-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--dark);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--primary);
        }

        .back-btn {
            background: var(--light-gray);
            border: none;
            padding: 10px 16px;
            border-radius: var(--border-radius);
            color: var(--gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--animation-speed);
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        .tabs {
            display: flex;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            overflow: hidden;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--gray);
            transition: all var(--animation-speed);
            position: relative;
        }

        .tab:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .tab.active {
            background: var(--primary);
            color: var(--white);
        }

        .tab i {
            margin-right: 8px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            min-height: 600px;
        }

        .panel {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: var(--light-gray);
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
            margin: 16px 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            transition: border-color var(--animation-speed);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .fields-list {
            flex: 1;
            padding: 0 20px 20px;
            overflow-y: auto;
            max-height: 500px;
        }

        .field-item {
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--animation-speed);
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.5s ease forwards;
        }

        .field-item:nth-child(n) {
            animation-delay: calc(0.1s * var(--item-index, 0));
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .field-item.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .field-item.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .field-name {
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .field-type {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .field-preview {
            font-size: 0.8rem;
            color: var(--primary);
            font-style: italic;
        }

        .field-custom {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--warning);
            color: var(--white);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 12px;
        }

        .field-stats {
            margin-top: 6px;
        }

        .fill-bar {
            height: 4px;
            background: var(--light-gray);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .fill-progress {
            height: 100%;
            transition: width 0.3s ease;
        }

        .fill-text {
            font-size: 0.7rem;
            color: var(--gray);
            text-align: center;
        }

        .drop-zone {
            min-height: 100px;
            border: 2px dashed #e5e7eb;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            margin: 20px;
            transition: all var(--animation-speed);
        }

        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .preview-panel {
            grid-column: span 1;
            max-height: 600px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .preview-table th {
            background: var(--primary);
            color: var(--white);
            padding: 10px 8px;
            text-align: left;
            font-weight: 500;
        }

        .preview-table td {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .preview-table tbody tr:hover {
            background: var(--light-gray);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .save-panel {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            transition: border-color var(--animation-speed);
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--animation-speed);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--light-gray);
            color: var(--gray);
        }

        .btn-secondary:hover {
            background: var(--gray);
            color: var(--white);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform var(--animation-speed);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
            color: var(--white);
        }

        .notification.error {
            background: var(--danger);
            color: var(--white);
        }

        .notification.info {
            background: var(--primary);
            color: var(--white);
        }

        .notification.warning {
            background: var(--warning);
            color: var(--white);
        }

        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-text {
            margin-left: 12px;
            color: var(--gray);
        }

        /* Preset Management Styles */
        .preset-card {
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all var(--animation-speed);
        }

        .preset-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .preset-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .preset-title {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .preset-entity-badge {
            background: var(--primary);
            color: var(--white);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .preset-description {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .preset-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .preset-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: var(--success-hover);
        }

        .btn-warning {
            background: var(--warning);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .current-preset-indicator {
            background: var(--success);
            color: var(--white);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        .preset-fields-preview {
            font-size: 0.8rem;
            color: var(--gray);
            font-style: italic;
            margin-top: 8px;
            max-height: 60px;
            overflow: hidden;
            position: relative;
        }

        .preset-fields-preview:after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 20px;
            background: linear-gradient(to right, transparent, var(--white));
        }

        /* Export Progress Styles */
        .export-card {
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all var(--animation-speed);
        }

        .export-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .export-id {
            font-family: 'Courier New', monospace;
            background: var(--light-gray);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .export-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-starting { background: #dbeafe; color: #1e40af; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-failed { background: #fee2e2; color: #991b1b; }
        .status-cancelled { background: #f3f4f6; color: #374151; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--success-hover));
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--gray);
            margin-top: 5px;
        }

        .entities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .entity-card {
            background: var(--light-gray);
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
        }

        .entity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .entity-name {
            font-weight: 600;
            color: var(--dark);
            text-transform: capitalize;
        }

        .entity-progress {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .export-results {
            background: var(--primary-light);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        .result-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .result-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all var(--animation-speed);
        }

        .result-link:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .connection-indicator {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            transition: all var(--animation-speed);
        }

        .connection-indicator.connected {
            background: var(--success);
            color: var(--white);
        }

        .connection-indicator.disconnected {
            background: var(--danger);
            color: var(--white);
        }

        .connection-indicator.connecting {
            background: var(--warning);
            color: var(--white);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cog"></i>Настройки экспорта и управление пресетами</h1>
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Назад к дашборду
            </a>
        </div>

        <div class="tabs">
            <button class="tab active" data-entity="deals">
                <i class="fas fa-handshake"></i>Сделки
            </button>
            <button class="tab" data-entity="contacts">
                <i class="fas fa-users"></i>Контакты
            </button>
            <button class="tab" data-entity="companies">
                <i class="fas fa-building"></i>Компании
            </button>
            <!-- Events tab removed per requirement 9.5 -->
            <button class="tab" data-entity="users">
                <i class="fas fa-user-tie"></i>Пользователи
            </button>
            <button class="tab" data-entity="pipelines">
                <i class="fas fa-sitemap"></i>Воронки
            </button>
        </div>

        <div class="main-content">
            <!-- Available Fields Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-list"></i>
                        Доступные поля
                    </div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="show-unnamed-fields" style="cursor: pointer;">
                            <span>Технические поля</span>
                        </label>
                        <button class="btn btn-secondary" onclick="refreshFields()">
                            <i class="fas fa-refresh"></i>
                        </button>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Поиск полей..." id="field-search">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="fields-list" id="available-fields">
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Загрузка полей...</div>
                    </div>
                </div>
            </div>

            <!-- Selected Fields Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-check-square"></i>
                        Выбранные поля
                    </div>
                </div>
                <div class="fields-list" id="selected-fields">
                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-mouse-pointer"></i>
                        Перетащите поля сюда
                    </div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="panel preview-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-eye"></i>
                        Предпросмотр данных
                    </div>
                </div>
                <div style="flex: 1; overflow: auto;">
                    <table class="preview-table" id="preview-table">
                        <thead>
                            <tr id="preview-header">
                                <th>Выберите поля для предпросмотра</th>
                            </tr>
                        </thead>
                        <tbody id="preview-body">
                            <tr>
                                <td style="text-align: center; color: var(--gray); padding: 40px;">
                                    Данные появятся после выбора полей
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Preset Management Panel -->
        <div class="save-panel">
            <h3 style="margin-bottom: 20px; color: var(--dark); display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-layer-group"></i>
                Управление пресетами
            </h3>

            <!-- Preset Load Section -->
            <div style="margin-bottom: 24px; padding: 16px; background: var(--light-gray); border-radius: var(--border-radius);">
                <div class="form-group">
                    <label class="form-label">Загрузить существующий пресет</label>
                    <div style="display: flex; gap: 8px; align-items: end;">
                        <div style="flex: 1;">
                            <select class="form-input" id="preset-selector" onchange="onPresetSelected()">
                                <option value="">Выберите пресет...</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary" onclick="loadSelectedPreset()">
                            <i class="fas fa-folder-open"></i>
                            Загрузить
                        </button>
                        <button class="btn btn-secondary" onclick="refreshPresets()">
                            <i class="fas fa-refresh"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Preset Save Section -->
            <div style="margin-bottom: 24px; padding: 16px; background: var(--primary-light); border-radius: var(--border-radius);">
                <div class="form-group">
                    <label class="form-label">Сохранить как новый пресет</label>
                    <input type="text" class="form-input" id="preset-name" placeholder="Название пресета (например: Базовые поля сделок)">
                </div>
                <div class="form-group">
                    <label class="form-label">Описание пресета (опционально)</label>
                    <textarea class="form-textarea" id="preset-description" placeholder="Краткое описание пресета"></textarea>
                </div>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="saveAsPreset()">
                        <i class="fas fa-layer-group"></i>
                        Сохранить как пресет
                    </button>
                    <button class="btn btn-secondary" id="update-preset-btn" onclick="updateExistingPreset()" style="display: none;">
                        <i class="fas fa-edit"></i>
                        Обновить пресет
                    </button>
                </div>
            </div>

            <!-- Current Presets Display -->
            <div id="presets-list" style="margin-bottom: 20px;">
                <!-- Will be populated dynamically -->
            </div>

            <!-- Export Actions -->
            <div style="border-top: 1px solid #e5e7eb; padding-top: 20px;">
                <h4 style="margin-bottom: 12px; color: var(--dark);">Действия экспорта</h4>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="exportWithCurrentSettings()">
                        <i class="fas fa-download"></i>
                        Экспорт с текущими настройками
                    </button>
                    <button class="btn btn-success" onclick="exportWithSelectedPreset()">
                        <i class="fas fa-layer-group"></i>
                        Экспорт с выбранным пресетом
                    </button>
                    <button class="btn btn-secondary" onclick="syncFlattenedData()">
                        <i class="fas fa-sync"></i>
                        Синхронизировать данные
                    </button>
                </div>
            </div>
        </div>

        <!-- Export Progress Section -->
        <div class="save-panel" id="progress-section" style="display: none;">
            <h3 style="margin-bottom: 20px; color: var(--dark); display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-chart-line"></i>
                Прогресс экспорта
                <div id="connection-status" style="margin-left: auto; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; background: var(--danger); color: white;">
                    Не подключен
                </div>
            </h3>

            <!-- Active Exports -->
            <div id="active-exports-container">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Export Results -->
            <div id="export-results-container" style="margin-top: 20px;">
                <!-- Will show completed export results -->
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script>
        let currentEntity = 'deals';
        let availableFields = [];
        let selectedFields = [];
        let fieldsCache = {};
        let previewCache = {};
        let presets = [];
        let currentPresetId = null;

        // Progress tracking variables
        let websocket = null;
        let activeExports = {};
        let completedExports = {};
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        // Initialize the interface
        document.addEventListener('DOMContentLoaded', function() {
            setupTabs();
            setupDragAndDrop();
            setupSearch();
            loadFieldsForEntity(currentEntity);
            loadPresets();
            connectWebSocket();
            loadActiveExports();
        });

        // Tab functionality
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const entity = this.dataset.entity;
                    switchToEntity(entity);
                });
            });
        }

        function switchToEntity(entity) {
            if (entity === currentEntity) return;

            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.entity === entity);
            });

            currentEntity = entity;
            selectedFields = [];
            currentPresetId = null;
            updateSelectedFieldsDisplay();
            updatePreview();
            updatePresetInterface();
            loadFieldsForEntity(entity);
            loadPresets();
        }

        // Load fields for entity
        async function loadFieldsForEntity(entity, forceRefresh = false) {
            try {
                showLoadingInPanel('available-fields');

                const cacheKey = `${entity}_fields`;
                const includeUnnamed = document.getElementById('show-unnamed-fields').checked;
                const fullCacheKey = `${cacheKey}_${includeUnnamed}`;

                if (!forceRefresh && fieldsCache[fullCacheKey]) {
                    availableFields = fieldsCache[fullCacheKey];
                    updateAvailableFieldsDisplay();
                    return;
                }

                const response = await fetch(`/api/export-settings/fields/${entity}?force_refresh=${forceRefresh}&include_unnamed_fields=${includeUnnamed}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                availableFields = data.fields;
                fieldsCache[fullCacheKey] = availableFields;

                // Show statistics in console
                console.log(`Loaded ${data.total_count} fields (${data.friendly_count} friendly, ${data.technical_count} technical)`);

                updateAvailableFieldsDisplay();

            } catch (error) {
                console.error('Error loading fields:', error);
                showNotification('Ошибка загрузки полей: ' + error.message, 'error');
            } finally {
                hideLoadingInPanel('available-fields');
            }
        }

        function showLoadingInPanel(panelId) {
            const panel = document.getElementById(panelId);
            const overlay = panel.querySelector('.loading-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
            }
        }

        function hideLoadingInPanel(panelId) {
            const panel = document.getElementById(panelId);
            const overlay = panel.querySelector('.loading-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Update available fields display
        function updateAvailableFieldsDisplay() {
            const container = document.getElementById('available-fields');
            const searchTerm = document.getElementById('field-search').value.toLowerCase();
            const showTechnicalFields = document.getElementById('show-unnamed-fields').checked;

            const filteredFields = availableFields.filter(field => {
                // Filter by search term
                const matchesSearch = field.field_name.toLowerCase().includes(searchTerm) ||
                                    field.description.toLowerCase().includes(searchTerm);

                // Filter by user friendliness (hide technical fields if checkbox is not checked)
                const isUserFriendlyEnough = showTechnicalFields || field.is_user_friendly;

                return matchesSearch && isUserFriendlyEnough;
            });

            container.innerHTML = '';

            filteredFields.forEach((field, index) => {
                const fieldElement = createFieldElement(field, index);
                fieldElement.addEventListener('click', () => selectField(field));
                container.appendChild(fieldElement);
            });
        }

        function createFieldElement(field, index) {
            const div = document.createElement('div');
            div.className = 'field-item';
            div.style.setProperty('--item-index', index);
            div.draggable = true;
            div.dataset.fieldId = field.field_id;

            // Calculate fill percentage color
            const fillPercentage = field.fill_percentage || 0;
            const fillColor = fillPercentage > 70 ? 'var(--success)' :
                            fillPercentage > 30 ? 'var(--warning)' : 'var(--danger)';

            // Add visual indicator for technical fields
            const technicalBadge = !field.is_user_friendly ?
                '<div class="field-technical" style="position: absolute; top: 8px; right: 8px; background: var(--warning); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px;">ID</div>' : '';

            div.innerHTML = `
                <div class="field-name">${field.field_name}</div>
                <div class="field-type">${field.field_type}</div>
                ${field.fill_percentage !== undefined ?
                    `<div class="field-stats">
                        <div class="fill-bar">
                            <div class="fill-progress" style="width: ${fillPercentage}%; background: ${fillColor}"></div>
                        </div>
                        <div class="fill-text">${fillPercentage}% заполнено</div>
                    </div>` : ''}
                ${field.preview_data && field.preview_data.length > 0 ?
                    `<div class="field-preview">Пример: ${field.preview_data[0]}</div>` : ''}
                ${field.is_custom ? '<div class="field-custom">Custom</div>' : ''}
                ${technicalBadge}
            `;

            // Add drag handlers
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('field-search');
            searchInput.addEventListener('input', updateAvailableFieldsDisplay);

            // Add unnamed fields checkbox handler
            const unnamedCheckbox = document.getElementById('show-unnamed-fields');
            unnamedCheckbox.addEventListener('change', function() {
                // Clear cache when toggling unnamed fields
                fieldsCache = {};
                loadFieldsForEntity(currentEntity, true);
            });
        }

        // Field selection
        function selectField(field) {
            if (selectedFields.find(f => f.field_id === field.field_id)) {
                showNotification('Поле уже выбрано', 'error');
                return;
            }

            selectedFields.push(field);
            updateSelectedFieldsDisplay();
            updatePreview();
        }

        function removeField(fieldId) {
            selectedFields = selectedFields.filter(f => f.field_id !== fieldId);
            updateSelectedFieldsDisplay();
            updatePreview();
        }

        function updateSelectedFieldsDisplay() {
            const container = document.getElementById('selected-fields');

            if (selectedFields.length === 0) {
                container.innerHTML = `
                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-mouse-pointer"></i>
                        Перетащите поля сюда
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            selectedFields.forEach((field, index) => {
                const fieldElement = createSelectedFieldElement(field, index);
                container.appendChild(fieldElement);
            });

            // Re-setup drag and drop for the new elements
            setupDragAndDrop();
        }

        function createSelectedFieldElement(field, index) {
            const div = document.createElement('div');
            div.className = 'field-item selected';
            div.draggable = true;
            div.dataset.fieldId = field.field_id;
            div.dataset.index = index;

            div.innerHTML = `
                <div class="field-name">${field.field_name}</div>
                <div class="field-type">${field.field_type}</div>
                <button onclick="removeField('${field.field_id}')" style="position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">×</button>
            `;

            div.addEventListener('dragstart', handleSelectedDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        // Drag and Drop functionality
        function setupDragAndDrop() {
            const selectedContainer = document.getElementById('selected-fields');

            selectedContainer.addEventListener('dragover', handleDragOver);
            selectedContainer.addEventListener('drop', handleDrop);
            selectedContainer.addEventListener('dragenter', handleDragEnter);
            selectedContainer.addEventListener('dragleave', handleDragLeave);
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.fieldId);
            e.dataTransfer.setData('source', 'available');
            e.target.classList.add('dragging');
        }

        function handleSelectedDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.fieldId);
            e.dataTransfer.setData('source', 'selected');
            e.dataTransfer.setData('index', e.target.dataset.index);
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragEnter(e) {
            e.preventDefault();
            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const fieldId = e.dataTransfer.getData('text/plain');
            const source = e.dataTransfer.getData('source');

            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.remove('drag-over');
            }

            if (source === 'available') {
                const field = availableFields.find(f => f.field_id === fieldId);
                if (field) {
                    selectField(field);
                }
            } else if (source === 'selected') {
                // Handle reordering within selected fields
                const oldIndex = parseInt(e.dataTransfer.getData('index'));
                const newIndex = getDropIndex(e.clientY);

                if (oldIndex !== newIndex) {
                    const [movedField] = selectedFields.splice(oldIndex, 1);
                    selectedFields.splice(newIndex, 0, movedField);
                    updateSelectedFieldsDisplay();
                    updatePreview();
                }
            }
        }

        function getDropIndex(clientY) {
            const selectedContainer = document.getElementById('selected-fields');
            const fieldElements = [...selectedContainer.querySelectorAll('.field-item')];

            for (let i = 0; i < fieldElements.length; i++) {
                const rect = fieldElements[i].getBoundingClientRect();
                if (clientY < rect.top + rect.height / 2) {
                    return i;
                }
            }
            return fieldElements.length;
        }

        // Preview functionality
        async function updatePreview() {
            if (selectedFields.length === 0) {
                document.getElementById('preview-header').innerHTML = '<th>Выберите поля для предпросмотра</th>';
                document.getElementById('preview-body').innerHTML = `
                    <tr><td style="text-align: center; color: var(--gray); padding: 40px;">
                        Данные появятся после выбора полей
                    </td></tr>
                `;
                return;
            }

            try {
                // Update header
                const headerRow = document.getElementById('preview-header');
                headerRow.innerHTML = selectedFields.map(field =>
                    `<th>${field.field_name}</th>`
                ).join('');

                // Load preview data for each field
                const previewData = await Promise.all(
                    selectedFields.map(field => loadFieldPreview(field))
                );

                // Update body
                const bodyElement = document.getElementById('preview-body');
                const maxRows = Math.max(...previewData.map(data => data.length), 1);

                bodyElement.innerHTML = '';
                for (let i = 0; i < Math.min(maxRows, 5); i++) {
                    const row = document.createElement('tr');
                    row.innerHTML = selectedFields.map((field, fieldIndex) => {
                        const value = previewData[fieldIndex][i] || '';
                        return `<td>${value}</td>`;
                    }).join('');
                    bodyElement.appendChild(row);
                }

            } catch (error) {
                console.error('Error updating preview:', error);
                showNotification('Ошибка загрузки предпросмотра: ' + error.message, 'error');
            }
        }

        async function loadFieldPreview(field) {
            const cacheKey = `${currentEntity}_${field.field_id}_preview`;

            if (previewCache[cacheKey]) {
                return previewCache[cacheKey];
            }

            try {
                const response = await fetch(`/api/export-settings/preview/${currentEntity}/${encodeURIComponent(field.field_id)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const previewData = data.preview_data || [];

                previewCache[cacheKey] = previewData;
                return previewData;

            } catch (error) {
                console.error(`Error loading preview for ${field.field_id}:`, error);
                return [];
            }
        }

        // Preset management functions
        async function loadPresets() {
            try {
                const response = await fetch(`/api/presets?entity_type=${currentEntity}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                presets = data.presets || [];
                updatePresetSelector();
                updatePresetsList();

            } catch (error) {
                console.error('Error loading presets:', error);
                showNotification('Ошибка загрузки пресетов: ' + error.message, 'error');
            }
        }

        function updatePresetSelector() {
            const selector = document.getElementById('preset-selector');

            selector.innerHTML = '<option value="">Выберите пресет...</option>';

            presets.forEach(preset => {
                const option = document.createElement('option');
                option.value = preset.preset_id;
                option.textContent = `${preset.name} (${preset.selected_fields.length} полей)`;
                if (preset.preset_id === currentPresetId) {
                    option.selected = true;
                }
                selector.appendChild(option);
            });
        }

        function updatePresetsList() {
            const container = document.getElementById('presets-list');

            if (presets.length === 0) {
                container.innerHTML = '<p style="color: var(--gray); text-align: center; padding: 20px;">Нет пресетов для данного типа сущности</p>';
                return;
            }

            container.innerHTML = presets.map(preset => createPresetCard(preset)).join('');
        }

        function createPresetCard(preset) {
            const isCurrentPreset = preset.preset_id === currentPresetId;
            const createdDate = new Date(preset.created_at).toLocaleDateString();
            const fieldsPreview = preset.selected_fields.slice(0, 3).join(', ') +
                                 (preset.selected_fields.length > 3 ? '...' : '');

            return `
                <div class="preset-card">
                    <div class="preset-header">
                        <div>
                            <div class="preset-title">
                                ${preset.name}
                                ${isCurrentPreset ? '<span class="current-preset-indicator">Текущий</span>' : ''}
                            </div>
                            <div class="preset-entity-badge">${preset.entity_type}</div>
                        </div>
                    </div>

                    ${preset.description ? `<div class="preset-description">${preset.description}</div>` : ''}

                    <div class="preset-stats">
                        <span><i class="fas fa-list"></i> ${preset.selected_fields.length} полей</span>
                        <span><i class="fas fa-calendar"></i> ${createdDate}</span>
                    </div>

                    <div class="preset-fields-preview">
                        Поля: ${fieldsPreview}
                    </div>

                    <div class="preset-actions">
                        <button class="btn btn-primary btn-sm" onclick="loadPreset('${preset.preset_id}')">
                            <i class="fas fa-folder-open"></i> Загрузить
                        </button>
                        <button class="btn btn-success btn-sm" onclick="exportWithPreset('${preset.preset_id}')">
                            <i class="fas fa-download"></i> Экспорт
                        </button>
                        <button class="btn btn-warning btn-sm" onclick="editPreset('${preset.preset_id}')">
                            <i class="fas fa-edit"></i> Изменить
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="duplicatePreset('${preset.preset_id}')">
                            <i class="fas fa-copy"></i> Копировать
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deletePreset('${preset.preset_id}')">
                            <i class="fas fa-trash"></i> Удалить
                        </button>
                    </div>
                </div>
            `;
        }

        function onPresetSelected() {
            const selectedPresetId = document.getElementById('preset-selector').value;
            // Just update UI to show selection, don't load automatically
        }

        async function loadSelectedPreset() {
            const selectedPresetId = document.getElementById('preset-selector').value;
            if (!selectedPresetId) {
                showNotification('Выберите пресет для загрузки', 'error');
                return;
            }

            await loadPreset(selectedPresetId);
        }

        async function loadPreset(presetId) {
            try {
                const response = await fetch(`/api/presets/${presetId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const preset = data.preset;

                // Switch to the preset's entity type if different
                if (preset.entity_type !== currentEntity) {
                    switchToEntity(preset.entity_type);
                    // Wait for fields to load
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                // Set selected fields based on preset
                selectedFields = availableFields.filter(field =>
                    preset.selected_fields.includes(field.field_id)
                );

                // Reorder fields according to preset field_order
                if (preset.field_order && preset.field_order.length > 0) {
                    selectedFields.sort((a, b) => {
                        const indexA = preset.field_order.indexOf(a.field_id);
                        const indexB = preset.field_order.indexOf(b.field_id);
                        return indexA - indexB;
                    });
                }

                currentPresetId = presetId;
                updateSelectedFieldsDisplay();
                updatePreview();
                updatePresetInterface();

                showNotification(`Пресет "${preset.name}" загружен!`, 'success');

            } catch (error) {
                console.error('Error loading preset:', error);
                showNotification('Ошибка загрузки пресета: ' + error.message, 'error');
            }
        }

        async function saveAsPreset() {
            const name = document.getElementById('preset-name').value.trim();
            if (!name) {
                showNotification('Введите название пресета', 'error');
                return;
            }

            if (selectedFields.length === 0) {
                showNotification('Выберите хотя бы одно поле', 'error');
                return;
            }

            try {
                const presetData = {
                    name: name,
                    entity_type: currentEntity,
                    description: document.getElementById('preset-description').value.trim() || '',
                    selected_fields: selectedFields.map(f => f.field_id),
                    field_order: selectedFields.map(f => f.field_id),
                    custom_field_mappings: {}
                };

                const response = await fetch('/api/presets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(presetData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to create preset');
                }

                const result = await response.json();
                currentPresetId = result.preset_id;

                // Clear form
                document.getElementById('preset-name').value = '';
                document.getElementById('preset-description').value = '';

                showNotification('Пресет успешно сохранен!', 'success');
                await loadPresets();

            } catch (error) {
                console.error('Error saving preset:', error);
                showNotification('Ошибка сохранения пресета: ' + error.message, 'error');
            }
        }

        async function updateExistingPreset() {
            if (!currentPresetId) {
                showNotification('Не выбран пресет для обновления', 'error');
                return;
            }

            if (selectedFields.length === 0) {
                showNotification('Выберите хотя бы одно поле', 'error');
                return;
            }

            try {
                const currentPreset = presets.find(p => p.preset_id === currentPresetId);
                if (!currentPreset) {
                    showNotification('Пресет не найден', 'error');
                    return;
                }

                const presetData = {
                    ...currentPreset,
                    selected_fields: selectedFields.map(f => f.field_id),
                    field_order: selectedFields.map(f => f.field_id)
                };

                const response = await fetch(`/api/presets/${currentPresetId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(presetData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update preset');
                }

                showNotification('Пресет успешно обновлен!', 'success');
                await loadPresets();

            } catch (error) {
                console.error('Error updating preset:', error);
                showNotification('Ошибка обновления пресета: ' + error.message, 'error');
            }
        }

        async function editPreset(presetId) {
            const preset = presets.find(p => p.preset_id === presetId);
            if (!preset) {
                showNotification('Пресет не найден', 'error');
                return;
            }

            // Load the preset first
            await loadPreset(presetId);

            // Fill the form with preset data for editing
            document.getElementById('preset-name').value = preset.name;
            document.getElementById('preset-description').value = preset.description || '';

            showNotification('Пресет загружен для редактирования. Измените поля и нажмите "Обновить пресет".', 'info');
        }

        async function duplicatePreset(presetId) {
            const preset = presets.find(p => p.preset_id === presetId);
            if (!preset) {
                showNotification('Пресет не найден', 'error');
                return;
            }

            const newName = prompt(`Введите название для копии пресета "${preset.name}":`, `${preset.name} (копия)`);
            if (!newName) return;

            try {
                const response = await fetch(`/api/presets/${presetId}/duplicate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: newName })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to duplicate preset');
                }

                showNotification('Пресет успешно скопирован!', 'success');
                await loadPresets();

            } catch (error) {
                console.error('Error duplicating preset:', error);
                showNotification('Ошибка копирования пресета: ' + error.message, 'error');
            }
        }

        async function deletePreset(presetId) {
            const preset = presets.find(p => p.preset_id === presetId);
            if (!preset) return;

            if (!confirm(`Вы уверены, что хотите удалить пресет "${preset.name}"? Это действие нельзя отменить.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/presets/${presetId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete preset');
                }

                if (currentPresetId === presetId) {
                    currentPresetId = null;
                }

                showNotification('Пресет успешно удален!', 'success');
                await loadPresets();

            } catch (error) {
                console.error('Error deleting preset:', error);
                showNotification('Ошибка удаления пресета: ' + error.message, 'error');
            }
        }

        async function refreshPresets() {
            await loadPresets();
            showNotification('Список пресетов обновлен', 'info');
        }

        async function exportWithPreset(presetId) {
            try {
                // Show progress section
                document.getElementById('progress-section').style.display = 'block';

                // Start export with preset
                const response = await fetch('/export/sheets/with-presets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        preset_ids: {
                            [currentEntity]: presetId
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start preset export');
                }

                const data = await response.json();
                showNotification('Экспорт с пресетом завершен!', 'success');

                // Show results
                displayExportResults(data.urls, `Результаты экспорта с пресетом (ID: ${presetId})`);

                // Scroll to progress section
                document.getElementById('progress-section').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('Error starting preset export:', error);
                showNotification('Ошибка экспорта с пресетом: ' + error.message, 'error');
            }
        }

        function updatePresetInterface() {
            updatePresetSelector();
            updatePresetsList();

            // Show/hide update button based on whether a preset is loaded
            const updateBtn = document.getElementById('update-preset-btn');
            if (currentPresetId) {
                updateBtn.style.display = 'inline-flex';
            } else {
                updateBtn.style.display = 'none';
            }
        }

        // Export functions
        async function exportWithCurrentSettings() {
            if (selectedFields.length === 0) {
                showNotification('Выберите поля для экспорта', 'error');
                return;
            }

            try {
                // Show progress section
                document.getElementById('progress-section').style.display = 'block';

                // Start enhanced export
                const response = await fetch('/export/sheets/enhanced', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        entity_type: currentEntity,
                        selected_fields: selectedFields.map(f => f.field_id),
                        field_order: selectedFields.map(f => f.field_id)
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start export');
                }

                const data = await response.json();
                showNotification(`Экспорт запущен! ID: ${data.export_id}`, 'success');

                // Scroll to progress section
                document.getElementById('progress-section').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('Error starting export:', error);
                showNotification('Ошибка запуска экспорта: ' + error.message, 'error');
            }
        }

        async function exportWithSelectedPreset() {
            const selectedPresetId = document.getElementById('preset-selector').value;
            if (!selectedPresetId) {
                showNotification('Выберите пресет для экспорта', 'error');
                return;
            }

            try {
                // Show progress section
                document.getElementById('progress-section').style.display = 'block';

                // Start export with preset
                const response = await fetch('/export/sheets/with-presets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        preset_ids: {
                            [currentEntity]: selectedPresetId
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start preset export');
                }

                const data = await response.json();
                showNotification('Экспорт с пресетом завершен!', 'success');

                // Show results
                displayExportResults(data.urls, 'Результаты экспорта с пресетом');

            } catch (error) {
                console.error('Error starting preset export:', error);
                showNotification('Ошибка экспорта с пресетом: ' + error.message, 'error');
            }
        }



        // Utility functions
        function refreshFields() {
            loadFieldsForEntity(currentEntity, true);
        }



        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Flattening data functionality
        async function syncFlattenedData() {
            try {
                showNotification('Синхронизация данных...', 'info');

                const response = await fetch(`/api/flattening/sync/${currentEntity}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    showNotification(`Успешно синхронизировано ${result.processed} записей за ${result.duration}с`, 'success');
                    // Refresh fields to get updated statistics
                    await refreshFields();
                } else {
                    showNotification(`Ошибка синхронизации: ${result.message}`, 'error');
                }

            } catch (error) {
                console.error('Error syncing flattened data:', error);
                showNotification('Ошибка синхронизации данных: ' + error.message, 'error');
            }
        }

        async function getFlatteningStatus() {
            try {
                const response = await fetch('/api/flattening/status');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const status = await response.json();
                return status;

            } catch (error) {
                console.error('Error getting flattening status:', error);
                return null;
            }
        }

        // Enhanced field loading with statistics
        async function loadFieldsForEntity(entity, forceRefresh = false) {
            try {
                showLoadingInPanel('available-fields');

                const cacheKey = `${entity}_fields`;
                const includeUnnamed = document.getElementById('show-unnamed-fields').checked;
                const fullCacheKey = `${cacheKey}_${includeUnnamed}`;

                if (!forceRefresh && fieldsCache[fullCacheKey]) {
                    availableFields = fieldsCache[fullCacheKey];
                    updateAvailableFieldsDisplay();
                    return;
                }

                const response = await fetch(`/api/export-settings/fields/${entity}?force_refresh=${forceRefresh}&include_unnamed_fields=${includeUnnamed}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                availableFields = data.fields;

                // Try to get flattened statistics
                try {
                    const flattenedStats = await fetch(`/api/flattening/statistics/${entity}`);
                    if (flattenedStats.ok) {
                        const statsData = await flattenedStats.json();

                        // Merge statistics with field data
                        availableFields = availableFields.map(field => {
                            const fieldStats = statsData.statistics[field.field_id];
                            if (fieldStats) {
                                field.fill_percentage = fieldStats.fill_percentage;
                                field.unique_values = fieldStats.unique_values;
                                field.total_records = fieldStats.total;
                            }
                            return field;
                        });
                    }
                } catch (error) {
                    console.warn('Could not load flattened statistics:', error);
                }

                fieldsCache[fullCacheKey] = availableFields;
                updateAvailableFieldsDisplay();

            } catch (error) {
                console.error('Error loading fields:', error);
                showNotification('Ошибка загрузки полей: ' + error.message, 'error');
            } finally {
                hideLoadingInPanel('available-fields');
            }
        }

        // ===== PROGRESS TRACKING FUNCTIONS =====

        // Connect to WebSocket for real-time progress updates
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/progress`;

            updateConnectionStatus('connecting');
            websocket = new WebSocket(wsUrl);

            websocket.onopen = function() {
                console.log('WebSocket connected');
                updateConnectionStatus('connected');
                reconnectAttempts = 0;

                // Send ping to keep connection alive
                setInterval(() => {
                    if (websocket.readyState === WebSocket.OPEN) {
                        websocket.send(JSON.stringify({type: 'ping'}));
                    }
                }, 30000);
            };

            websocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            websocket.onclose = function() {
                console.log('WebSocket disconnected');
                updateConnectionStatus('disconnected');

                // Attempt to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    setTimeout(() => {
                        console.log(`Reconnecting... (attempt ${reconnectAttempts})`);
                        connectWebSocket();
                    }, 2000 * reconnectAttempts);
                }
            };

            websocket.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('disconnected');
            };
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            if (data.type === 'progress_update') {
                updateExportProgress(data);
            }
        }

        // Update connection status indicator
        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connection-status');
            statusEl.className = `connection-indicator ${status}`;

            switch (status) {
                case 'connected':
                    statusEl.textContent = 'Подключен';
                    break;
                case 'connecting':
                    statusEl.textContent = 'Подключение...';
                    break;
                case 'disconnected':
                    statusEl.textContent = 'Не подключен';
                    break;
            }
        }

        // Load active exports from API
        async function loadActiveExports() {
            try {
                const response = await fetch('/api/progress');
                const data = await response.json();

                activeExports = data.active_exports || {};
                renderActiveExports();

                // Load detailed progress for each export
                for (const exportId of Object.keys(activeExports)) {
                    loadExportProgress(exportId);
                }

                // Show progress section if there are active exports
                if (Object.keys(activeExports).length > 0) {
                    document.getElementById('progress-section').style.display = 'block';
                }

            } catch (error) {
                console.error('Error loading active exports:', error);
            }
        }

        // Load detailed progress for a specific export
        async function loadExportProgress(exportId) {
            try {
                const response = await fetch(`/api/progress/${exportId}`);
                if (response.ok) {
                    const data = await response.json();
                    updateExportProgress(data);
                }
            } catch (error) {
                console.error(`Error loading progress for ${exportId}:`, error);
            }
        }

        // Update export progress in the UI
        function updateExportProgress(data) {
            activeExports[data.export_id] = data;

            // If export is completed, move to completed exports
            if (data.status === 'completed') {
                completedExports[data.export_id] = data;
                if (data.spreadsheet_urls) {
                    displayExportResults(data.spreadsheet_urls, `Экспорт завершен (ID: ${data.export_id})`);
                }
            }

            renderActiveExports();
        }

        // Render active exports
        function renderActiveExports() {
            const container = document.getElementById('active-exports-container');

            if (Object.keys(activeExports).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--gray); padding: 20px;">Нет активных экспортов</p>';
                return;
            }

            container.innerHTML = Object.values(activeExports)
                .filter(exportData => exportData.status !== 'completed')
                .map(exportData => renderExportCard(exportData))
                .join('');
        }

        // Render a single export card
        function renderExportCard(exportData) {
            const entities = exportData.entities || {};

            return `
                <div class="export-card" data-export-id="${exportData.export_id}">
                    <div class="export-header">
                        <div>
                            <div class="export-id">${exportData.export_id}</div>
                            <div style="margin-top: 5px;">
                                <span class="export-status status-${exportData.status}">${exportData.status}</span>
                            </div>
                        </div>
                        <div>
                            ${exportData.status === 'in_progress' ?
                                `<button class="btn-danger" onclick="cancelExport('${exportData.export_id}')" style="font-size: 0.8rem; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">Отменить</button>` :
                                ''
                            }
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${exportData.overall_progress || 0}%"></div>
                    </div>
                    <div class="progress-text">
                        Общий прогресс: ${(exportData.overall_progress || 0).toFixed(1)}%
                        ${exportData.estimated_completion ?
                            `• Завершение: ${formatTimestamp(exportData.estimated_completion)}` :
                            ''
                        }
                        ${exportData.duration ?
                            `• Время: ${formatDuration(exportData.duration)}` :
                            ''
                        }
                    </div>

                    <div class="entities-grid">
                        ${Object.entries(entities).map(([entityType, entityData]) => `
                            <div class="entity-card">
                                <div class="entity-header">
                                    <div class="entity-name">${entityType}</div>
                                    <div class="export-status status-${entityData.status}">${entityData.status}</div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${entityData.progress_percentage || 0}%"></div>
                                </div>
                                <div class="entity-progress">
                                    ${entityData.processed || 0}/${entityData.total || 0} записей
                                    ${entityData.current_batch && entityData.total_batches ?
                                        `<br>Пакет ${entityData.current_batch}/${entityData.total_batches}` :
                                        ''
                                    }
                                    ${entityData.processing_rate ?
                                        `<br>${entityData.processing_rate.toFixed(1)} записей/сек` :
                                        ''
                                    }
                                </div>
                                ${entityData.error_message ?
                                    `<div style="color: var(--danger); font-size: 0.8rem; margin-top: 5px;">${entityData.error_message}</div>` :
                                    ''
                                }
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Cancel an export
        async function cancelExport(exportId) {
            if (!confirm('Вы уверены, что хотите отменить этот экспорт?')) {
                return;
            }

            try {
                const response = await fetch(`/api/progress/${exportId}/cancel`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showNotification(`Экспорт ${exportId} отменен`, 'info');
                } else {
                    const error = await response.json();
                    showNotification('Ошибка отмены экспорта: ' + (error.detail || 'Unknown error'), 'error');
                }

            } catch (error) {
                console.error('Error cancelling export:', error);
                showNotification('Ошибка отмены экспорта: ' + error.message, 'error');
            }
        }

        // Display export results
        function displayExportResults(urls, title) {
            const container = document.getElementById('export-results-container');

            const resultHtml = `
                <div class="export-results">
                    <h4 style="margin-bottom: 10px; color: var(--dark);">${title}</h4>
                    <div class="result-links">
                        ${Object.entries(urls).map(([entityType, url]) =>
                            `<a href="${url}" target="_blank" class="result-link">
                                <i class="fas fa-external-link-alt"></i>
                                ${entityType}
                            </a>`
                        ).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = resultHtml + container.innerHTML;

            // Scroll to results
            container.scrollIntoView({ behavior: 'smooth' });
        }

        // Utility functions for progress display
        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}м ${remainingSeconds}с`;
        }

        // Refresh active exports every 30 seconds as fallback
        setInterval(loadActiveExports, 30000);
    </script>
</body>
</html>
