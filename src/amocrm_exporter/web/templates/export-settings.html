<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки экспорта данных - AmoCRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray: #6b7280;
            --light-gray: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --animation-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--dark);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--primary);
        }

        .back-btn {
            background: var(--light-gray);
            border: none;
            padding: 10px 16px;
            border-radius: var(--border-radius);
            color: var(--gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--animation-speed);
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        .tabs {
            display: flex;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            overflow: hidden;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--gray);
            transition: all var(--animation-speed);
            position: relative;
        }

        .tab:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .tab.active {
            background: var(--primary);
            color: var(--white);
        }

        .tab i {
            margin-right: 8px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            min-height: 600px;
        }

        .panel {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: var(--light-gray);
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
            margin: 16px 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            transition: border-color var(--animation-speed);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .fields-list {
            flex: 1;
            padding: 0 20px 20px;
            overflow-y: auto;
            max-height: 500px;
        }

        .field-item {
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--animation-speed);
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.5s ease forwards;
        }

        .field-item:nth-child(n) {
            animation-delay: calc(0.1s * var(--item-index, 0));
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .field-item.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .field-item.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .field-name {
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .field-type {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .field-preview {
            font-size: 0.8rem;
            color: var(--primary);
            font-style: italic;
        }

        .field-custom {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--warning);
            color: var(--white);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 12px;
        }

        .field-stats {
            margin-top: 6px;
        }

        .fill-bar {
            height: 4px;
            background: var(--light-gray);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .fill-progress {
            height: 100%;
            transition: width 0.3s ease;
        }

        .fill-text {
            font-size: 0.7rem;
            color: var(--gray);
            text-align: center;
        }

        .drop-zone {
            min-height: 100px;
            border: 2px dashed #e5e7eb;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            margin: 20px;
            transition: all var(--animation-speed);
        }

        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .preview-panel {
            grid-column: span 1;
            max-height: 600px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .preview-table th {
            background: var(--primary);
            color: var(--white);
            padding: 10px 8px;
            text-align: left;
            font-weight: 500;
        }

        .preview-table td {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .preview-table tbody tr:hover {
            background: var(--light-gray);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .save-panel {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            transition: border-color var(--animation-speed);
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--animation-speed);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--light-gray);
            color: var(--gray);
        }

        .btn-secondary:hover {
            background: var(--gray);
            color: var(--white);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform var(--animation-speed);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
            color: var(--white);
        }

        .notification.error {
            background: var(--danger);
            color: var(--white);
        }

        .notification.info {
            background: var(--primary);
            color: var(--white);
        }

        .notification.warning {
            background: var(--warning);
            color: var(--white);
        }

        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-text {
            margin-left: 12px;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cog"></i>Настройки экспорта данных</h1>
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Назад к дашборду
            </a>
        </div>

        <div class="tabs">
            <button class="tab active" data-entity="deals">
                <i class="fas fa-handshake"></i>Сделки
            </button>
            <button class="tab" data-entity="contacts">
                <i class="fas fa-users"></i>Контакты
            </button>
            <button class="tab" data-entity="companies">
                <i class="fas fa-building"></i>Компании
            </button>
            <button class="tab" data-entity="events">
                <i class="fas fa-calendar"></i>События
            </button>
            <button class="tab" data-entity="users">
                <i class="fas fa-user-tie"></i>Пользователи
            </button>
            <button class="tab" data-entity="pipelines">
                <i class="fas fa-sitemap"></i>Воронки
            </button>
        </div>

        <div class="main-content">
            <!-- Available Fields Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-list"></i>
                        Доступные поля
                    </div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="show-unnamed-fields" style="cursor: pointer;">
                            <span>Технические поля</span>
                        </label>
                        <button class="btn btn-secondary" onclick="refreshFields()">
                            <i class="fas fa-refresh"></i>
                        </button>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Поиск полей..." id="field-search">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="fields-list" id="available-fields">
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Загрузка полей...</div>
                    </div>
                </div>
            </div>

            <!-- Selected Fields Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-check-square"></i>
                        Выбранные поля
                    </div>
                </div>
                <div class="fields-list" id="selected-fields">
                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-mouse-pointer"></i>
                        Перетащите поля сюда
                    </div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="panel preview-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-eye"></i>
                        Предпросмотр данных
                    </div>
                </div>
                <div style="flex: 1; overflow: auto;">
                    <table class="preview-table" id="preview-table">
                        <thead>
                            <tr id="preview-header">
                                <th>Выберите поля для предпросмотра</th>
                            </tr>
                        </thead>
                        <tbody id="preview-body">
                            <tr>
                                <td style="text-align: center; color: var(--gray); padding: 40px;">
                                    Данные появятся после выбора полей
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Save Settings Panel -->
        <div class="save-panel">
            <div class="form-group">
                <label class="form-label">Название настройки</label>
                <input type="text" class="form-input" id="settings-name" placeholder="Например: Экспорт для отчета">
            </div>
            <div class="form-group">
                <label class="form-label">Описание (опционально)</label>
                <textarea class="form-textarea" id="settings-description" placeholder="Краткое описание настройки экспорта"></textarea>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="saveSettings()">
                    <i class="fas fa-save"></i>
                    Сохранить настройки
                </button>
                <button class="btn btn-secondary" onclick="loadSettings()">
                    <i class="fas fa-folder-open"></i>
                    Загрузить настройки
                </button>
                <button class="btn btn-secondary" onclick="exportData()">
                    <i class="fas fa-download"></i>
                    Экспортировать данные
                </button>
                <button class="btn btn-secondary" onclick="syncFlattenedData()">
                    <i class="fas fa-sync"></i>
                    Синхронизировать данные
                </button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script>
        let currentEntity = 'deals';
        let availableFields = [];
        let selectedFields = [];
        let fieldsCache = {};
        let previewCache = {};

        // Initialize the interface
        document.addEventListener('DOMContentLoaded', function() {
            setupTabs();
            setupDragAndDrop();
            setupSearch();
            loadFieldsForEntity(currentEntity);
        });

        // Tab functionality
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const entity = this.dataset.entity;
                    switchToEntity(entity);
                });
            });
        }

        function switchToEntity(entity) {
            if (entity === currentEntity) return;

            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.entity === entity);
            });

            currentEntity = entity;
            selectedFields = [];
            updateSelectedFieldsDisplay();
            updatePreview();
            loadFieldsForEntity(entity);
        }

        // Load fields for entity
        async function loadFieldsForEntity(entity, forceRefresh = false) {
            try {
                showLoadingInPanel('available-fields');

                const cacheKey = `${entity}_fields`;
                const includeUnnamed = document.getElementById('show-unnamed-fields').checked;
                const fullCacheKey = `${cacheKey}_${includeUnnamed}`;

                if (!forceRefresh && fieldsCache[fullCacheKey]) {
                    availableFields = fieldsCache[fullCacheKey];
                    updateAvailableFieldsDisplay();
                    return;
                }

                const response = await fetch(`/api/export-settings/fields/${entity}?force_refresh=${forceRefresh}&include_unnamed_fields=${includeUnnamed}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                availableFields = data.fields;
                fieldsCache[fullCacheKey] = availableFields;

                // Show statistics in console
                console.log(`Loaded ${data.total_count} fields (${data.friendly_count} friendly, ${data.technical_count} technical)`);

                updateAvailableFieldsDisplay();

            } catch (error) {
                console.error('Error loading fields:', error);
                showNotification('Ошибка загрузки полей: ' + error.message, 'error');
            } finally {
                hideLoadingInPanel('available-fields');
            }
        }

        function showLoadingInPanel(panelId) {
            const panel = document.getElementById(panelId);
            const overlay = panel.querySelector('.loading-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
            }
        }

        function hideLoadingInPanel(panelId) {
            const panel = document.getElementById(panelId);
            const overlay = panel.querySelector('.loading-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Update available fields display
        function updateAvailableFieldsDisplay() {
            const container = document.getElementById('available-fields');
            const searchTerm = document.getElementById('field-search').value.toLowerCase();
            const showTechnicalFields = document.getElementById('show-unnamed-fields').checked;

            const filteredFields = availableFields.filter(field => {
                // Filter by search term
                const matchesSearch = field.field_name.toLowerCase().includes(searchTerm) ||
                                    field.description.toLowerCase().includes(searchTerm);

                // Filter by user friendliness (hide technical fields if checkbox is not checked)
                const isUserFriendlyEnough = showTechnicalFields || field.is_user_friendly;

                return matchesSearch && isUserFriendlyEnough;
            });

            container.innerHTML = '';

            filteredFields.forEach((field, index) => {
                const fieldElement = createFieldElement(field, index);
                fieldElement.addEventListener('click', () => selectField(field));
                container.appendChild(fieldElement);
            });
        }

        function createFieldElement(field, index) {
            const div = document.createElement('div');
            div.className = 'field-item';
            div.style.setProperty('--item-index', index);
            div.draggable = true;
            div.dataset.fieldId = field.field_id;

            // Calculate fill percentage color
            const fillPercentage = field.fill_percentage || 0;
            const fillColor = fillPercentage > 70 ? 'var(--success)' :
                            fillPercentage > 30 ? 'var(--warning)' : 'var(--danger)';

            // Add visual indicator for technical fields
            const technicalBadge = !field.is_user_friendly ?
                '<div class="field-technical" style="position: absolute; top: 8px; right: 8px; background: var(--warning); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px;">ID</div>' : '';

            div.innerHTML = `
                <div class="field-name">${field.field_name}</div>
                <div class="field-type">${field.field_type}</div>
                ${field.fill_percentage !== undefined ?
                    `<div class="field-stats">
                        <div class="fill-bar">
                            <div class="fill-progress" style="width: ${fillPercentage}%; background: ${fillColor}"></div>
                        </div>
                        <div class="fill-text">${fillPercentage}% заполнено</div>
                    </div>` : ''}
                ${field.preview_data && field.preview_data.length > 0 ?
                    `<div class="field-preview">Пример: ${field.preview_data[0]}</div>` : ''}
                ${field.is_custom ? '<div class="field-custom">Custom</div>' : ''}
                ${technicalBadge}
            `;

            // Add drag handlers
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('field-search');
            searchInput.addEventListener('input', updateAvailableFieldsDisplay);

            // Add unnamed fields checkbox handler
            const unnamedCheckbox = document.getElementById('show-unnamed-fields');
            unnamedCheckbox.addEventListener('change', function() {
                // Clear cache when toggling unnamed fields
                fieldsCache = {};
                loadFieldsForEntity(currentEntity, true);
            });
        }

        // Field selection
        function selectField(field) {
            if (selectedFields.find(f => f.field_id === field.field_id)) {
                showNotification('Поле уже выбрано', 'error');
                return;
            }

            selectedFields.push(field);
            updateSelectedFieldsDisplay();
            updatePreview();
        }

        function removeField(fieldId) {
            selectedFields = selectedFields.filter(f => f.field_id !== fieldId);
            updateSelectedFieldsDisplay();
            updatePreview();
        }

        function updateSelectedFieldsDisplay() {
            const container = document.getElementById('selected-fields');

            if (selectedFields.length === 0) {
                container.innerHTML = `
                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-mouse-pointer"></i>
                        Перетащите поля сюда
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            selectedFields.forEach((field, index) => {
                const fieldElement = createSelectedFieldElement(field, index);
                container.appendChild(fieldElement);
            });

            // Re-setup drag and drop for the new elements
            setupDragAndDrop();
        }

        function createSelectedFieldElement(field, index) {
            const div = document.createElement('div');
            div.className = 'field-item selected';
            div.draggable = true;
            div.dataset.fieldId = field.field_id;
            div.dataset.index = index;

            div.innerHTML = `
                <div class="field-name">${field.field_name}</div>
                <div class="field-type">${field.field_type}</div>
                <button onclick="removeField('${field.field_id}')" style="position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">×</button>
            `;

            div.addEventListener('dragstart', handleSelectedDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        // Drag and Drop functionality
        function setupDragAndDrop() {
            const selectedContainer = document.getElementById('selected-fields');

            selectedContainer.addEventListener('dragover', handleDragOver);
            selectedContainer.addEventListener('drop', handleDrop);
            selectedContainer.addEventListener('dragenter', handleDragEnter);
            selectedContainer.addEventListener('dragleave', handleDragLeave);
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.fieldId);
            e.dataTransfer.setData('source', 'available');
            e.target.classList.add('dragging');
        }

        function handleSelectedDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.fieldId);
            e.dataTransfer.setData('source', 'selected');
            e.dataTransfer.setData('index', e.target.dataset.index);
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragEnter(e) {
            e.preventDefault();
            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const fieldId = e.dataTransfer.getData('text/plain');
            const source = e.dataTransfer.getData('source');

            const dropZone = document.getElementById('drop-zone');
            if (dropZone) {
                dropZone.classList.remove('drag-over');
            }

            if (source === 'available') {
                const field = availableFields.find(f => f.field_id === fieldId);
                if (field) {
                    selectField(field);
                }
            } else if (source === 'selected') {
                // Handle reordering within selected fields
                const oldIndex = parseInt(e.dataTransfer.getData('index'));
                const newIndex = getDropIndex(e.clientY);

                if (oldIndex !== newIndex) {
                    const [movedField] = selectedFields.splice(oldIndex, 1);
                    selectedFields.splice(newIndex, 0, movedField);
                    updateSelectedFieldsDisplay();
                    updatePreview();
                }
            }
        }

        function getDropIndex(clientY) {
            const selectedContainer = document.getElementById('selected-fields');
            const fieldElements = [...selectedContainer.querySelectorAll('.field-item')];

            for (let i = 0; i < fieldElements.length; i++) {
                const rect = fieldElements[i].getBoundingClientRect();
                if (clientY < rect.top + rect.height / 2) {
                    return i;
                }
            }
            return fieldElements.length;
        }

        // Preview functionality
        async function updatePreview() {
            if (selectedFields.length === 0) {
                document.getElementById('preview-header').innerHTML = '<th>Выберите поля для предпросмотра</th>';
                document.getElementById('preview-body').innerHTML = `
                    <tr><td style="text-align: center; color: var(--gray); padding: 40px;">
                        Данные появятся после выбора полей
                    </td></tr>
                `;
                return;
            }

            try {
                // Update header
                const headerRow = document.getElementById('preview-header');
                headerRow.innerHTML = selectedFields.map(field =>
                    `<th>${field.field_name}</th>`
                ).join('');

                // Load preview data for each field
                const previewData = await Promise.all(
                    selectedFields.map(field => loadFieldPreview(field))
                );

                // Update body
                const bodyElement = document.getElementById('preview-body');
                const maxRows = Math.max(...previewData.map(data => data.length), 1);

                bodyElement.innerHTML = '';
                for (let i = 0; i < Math.min(maxRows, 5); i++) {
                    const row = document.createElement('tr');
                    row.innerHTML = selectedFields.map((field, fieldIndex) => {
                        const value = previewData[fieldIndex][i] || '';
                        return `<td>${value}</td>`;
                    }).join('');
                    bodyElement.appendChild(row);
                }

            } catch (error) {
                console.error('Error updating preview:', error);
                showNotification('Ошибка загрузки предпросмотра: ' + error.message, 'error');
            }
        }

        async function loadFieldPreview(field) {
            const cacheKey = `${currentEntity}_${field.field_id}_preview`;

            if (previewCache[cacheKey]) {
                return previewCache[cacheKey];
            }

            try {
                const response = await fetch(`/api/export-settings/preview/${currentEntity}/${encodeURIComponent(field.field_id)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const previewData = data.preview_data || [];

                previewCache[cacheKey] = previewData;
                return previewData;

            } catch (error) {
                console.error(`Error loading preview for ${field.field_id}:`, error);
                return [];
            }
        }

        // Settings management
        async function saveSettings() {
            const name = document.getElementById('settings-name').value.trim();
            if (!name) {
                showNotification('Введите название настройки', 'error');
                return;
            }

            if (selectedFields.length === 0) {
                showNotification('Выберите хотя бы одно поле', 'error');
                return;
            }

            try {
                const settingsData = {
                    entity_type: currentEntity,
                    selected_fields: selectedFields.map(f => f.field_id),
                    field_order: selectedFields.map(f => f.field_id),
                    filters: {},
                    name: name,
                    description: document.getElementById('settings-description').value.trim() || null
                };

                const response = await fetch('/api/export-settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settingsData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                showNotification('Настройки успешно сохранены!', 'success');

                // Clear form
                document.getElementById('settings-name').value = '';
                document.getElementById('settings-description').value = '';

            } catch (error) {
                console.error('Error saving settings:', error);
                showNotification('Ошибка сохранения настроек: ' + error.message, 'error');
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/export-settings');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.settings.length === 0) {
                    showNotification('Нет сохраненных настроек', 'error');
                    return;
                }

                // Simple implementation - load the first setting
                // In a real implementation, you'd show a modal with all settings
                const settings = data.settings[0];

                // Switch to the entity
                switchToEntity(settings.entity_type);

                // Wait for fields to load, then select them
                setTimeout(() => {
                    selectedFields = availableFields.filter(field =>
                        settings.selected_fields.includes(field.field_id)
                    );
                    updateSelectedFieldsDisplay();
                    updatePreview();

                    document.getElementById('settings-name').value = settings.name;
                    document.getElementById('settings-description').value = settings.description || '';

                    showNotification('Настройки загружены!', 'success');
                }, 1000);

            } catch (error) {
                console.error('Error loading settings:', error);
                showNotification('Ошибка загрузки настроек: ' + error.message, 'error');
            }
        }

        // Utility functions
        function refreshFields() {
            loadFieldsForEntity(currentEntity, true);
        }

        function exportData() {
            if (selectedFields.length === 0) {
                showNotification('Выберите поля для экспорта', 'error');
                return;
            }

            // For now, just show a notification
            // In a real implementation, this would trigger the actual export
            showNotification('Функция экспорта будет реализована в следующей версии', 'warning');
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Flattening data functionality
        async function syncFlattenedData() {
            try {
                showNotification('Синхронизация данных...', 'info');

                const response = await fetch(`/api/flattening/sync/${currentEntity}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    showNotification(`Успешно синхронизировано ${result.processed} записей за ${result.duration}с`, 'success');
                    // Refresh fields to get updated statistics
                    await refreshFields();
                } else {
                    showNotification(`Ошибка синхронизации: ${result.message}`, 'error');
                }

            } catch (error) {
                console.error('Error syncing flattened data:', error);
                showNotification('Ошибка синхронизации данных: ' + error.message, 'error');
            }
        }

        async function getFlatteningStatus() {
            try {
                const response = await fetch('/api/flattening/status');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const status = await response.json();
                return status;

            } catch (error) {
                console.error('Error getting flattening status:', error);
                return null;
            }
        }

        // Enhanced field loading with statistics
        async function loadFieldsForEntity(entity, forceRefresh = false) {
            try {
                showLoadingInPanel('available-fields');

                const cacheKey = `${entity}_fields`;
                const includeUnnamed = document.getElementById('show-unnamed-fields').checked;
                const fullCacheKey = `${cacheKey}_${includeUnnamed}`;

                if (!forceRefresh && fieldsCache[fullCacheKey]) {
                    availableFields = fieldsCache[fullCacheKey];
                    updateAvailableFieldsDisplay();
                    return;
                }

                const response = await fetch(`/api/export-settings/fields/${entity}?force_refresh=${forceRefresh}&include_unnamed_fields=${includeUnnamed}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                availableFields = data.fields;

                // Try to get flattened statistics
                try {
                    const flattenedStats = await fetch(`/api/flattening/statistics/${entity}`);
                    if (flattenedStats.ok) {
                        const statsData = await flattenedStats.json();

                        // Merge statistics with field data
                        availableFields = availableFields.map(field => {
                            const fieldStats = statsData.statistics[field.field_id];
                            if (fieldStats) {
                                field.fill_percentage = fieldStats.fill_percentage;
                                field.unique_values = fieldStats.unique_values;
                                field.total_records = fieldStats.total;
                            }
                            return field;
                        });
                    }
                } catch (error) {
                    console.warn('Could not load flattened statistics:', error);
                }

                fieldsCache[fullCacheKey] = availableFields;
                updateAvailableFieldsDisplay();

            } catch (error) {
                console.error('Error loading fields:', error);
                showNotification('Ошибка загрузки полей: ' + error.message, 'error');
            } finally {
                hideLoadingInPanel('available-fields');
            }
        }
    </script>
</body>
</html>
