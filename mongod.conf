# MongoDB Configuration File для AmoCRM Data Exporter
# Оптимизировано для production использования

# Storage settings
storage:
  dbPath: /data/db
  journal:
    enabled: true
    commitIntervalMs: 100

  # WiredTiger engine settings
  wiredTiger:
    engineConfig:
      # Кэш размер (по умолчанию 50% RAM)
      cacheSizeGB: 1
      # Директории для данных и журналов
      directoryForIndexes: false
      # Compression
      journalCompressor: snappy
      collectionConfig:
        blockCompressor: snappy
      indexConfig:
        prefixCompression: true

# System log settings
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  verbosity: 1
  component:
    accessControl:
      verbosity: 1
    command:
      verbosity: 1
    control:
      verbosity: 1
    geo:
      verbosity: 1
    index:
      verbosity: 1
    network:
      verbosity: 1
    query:
      verbosity: 1
    replication:
      verbosity: 1
    sharding:
      verbosity: 1
    storage:
      verbosity: 1
    write:
      verbosity: 1

# Network settings
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 200
  wireObjectCheck: true
  ipv6: false

  # Connection pool settings
  serviceExecutor: adaptive

  # SSL settings (for production)
  # ssl:
  #   mode: requireSSL
  #   PEMKeyFile: /etc/ssl/mongodb.pem
  #   allowConnectionsWithoutCertificates: false

# Process management
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo

# Security settings
security:
  # Включить авторизацию для production
  # authorization: enabled
  # keyFile: /etc/mongodb/replica-set-key
  javascriptEnabled: false

# Operation profiling
operationProfiling:
  slowOpThresholdMs: 1000
  mode: slowOp
  slowOpSampleRate: 0.1

# Replication settings (для replica set)
# replication:
#   replSetName: "amocrm-rs"
#   oplogSizeMB: 2048

# Sharding settings (если нужно)
# sharding:
#   clusterRole: shardsvr

# Set parameters для оптимизации
setParameter:
  # Connection management
  connPoolMaxShardedConnsPerHost: 50
  connPoolMaxConnsPerHost: 50

  # Query optimization
  internalQueryPlanEvaluationMaxResults: 101
  internalQueryPlanEvaluationCollFraction: 0.3

  # Write concern
  journalCommitInterval: 100

  # Index building
  maxIndexBuildMemoryUsageMegabytes: 500

  # Aggregation
  internalDocumentSourceGroupMaxMemoryBytes: 104857600

  # Diagnostic data collection
  diagnosticDataCollectionEnabled: true

  # Failpoint для тестирования (отключить в production)
  enableTestCommands: false

  # Логирование медленных операций
  logLevel: 1

  # Управление памятью
  storageEngineCacheSizeGB: 1

  # Индексы
  allowDiskUseByDefault: true

# Audit settings (для production)
# auditLog:
#   destination: file
#   format: JSON
#   path: /var/log/mongodb/audit.log
#   filter: '{ atype: { $in: [ "authCheck", "authenticate" ] } }'